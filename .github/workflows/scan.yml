name: Futures market snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '31 * * * *'
permissions:
  contents: write
concurrency:
  group: futures-market-snapshot
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and analyze market
        id: scan
        continue-on-error: true
        run: python scanner.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || (git commit -m "Update market snapshot" && git push)
      - name: Mark incomplete scans as failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
