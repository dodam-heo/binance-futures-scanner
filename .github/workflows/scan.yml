name: Futures market snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '31 * * * *'
permissions:
  contents: write
concurrency:
  group: futures-market-snapshot
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check paper validator syntax and deterministic cases
        run: |
          python -m py_compile scanner.py paper_validate.py
          python -m unittest discover -s tests -p "test_*.py"
      - name: Fetch and analyze market
        id: scan
        continue-on-error: true
        run: python scanner.py
      - name: Track chronological paper fills
        if: always()
        continue-on-error: true
        run: python paper_validate.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if [ -f data/paper_ledger.json ]; then git add data/paper_ledger.json; fi
          git diff --cached --quiet || (git commit -m "Update market snapshot" && git push)
      - name: Mark incomplete scans as failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
